services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: wow
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
